trigger:
  branches:
    include:
      - TheoDev

pr:
  branches:
    include:
      - TheoDev

pool:
  name: Default

variables:
  - group: ThriftedAppAPI-CI-DEV
  - name: buildConfiguration
    value: Release
  - name: dotnetSdkVersion
    value: 8.0.x
  - name: runApiIntegrationTests
    value: 'false'

steps:
  - checkout: self
    fetchDepth: '0'

  - task: UseDotNet@2
    displayName: Use .NET SDK $(dotnetSdkVersion)
    inputs:
      packageType: sdk
      version: $(dotnetSdkVersion)

  - script: dotnet --info
    displayName: Dotnet Info

  - task: DotNetCoreCLI@2
    displayName: Restore
    inputs:
      command: restore
      projects: EComAPI.sln

  - task: DotNetCoreCLI@2
    displayName: Build
    inputs:
      command: build
      projects: EComAPI.sln
      arguments: --configuration $(buildConfiguration) --no-restore

  - task: DotNetCoreCLI@2
    displayName: Test Application Layer
    inputs:
      command: test
      projects: tests/EComAPI.Application.Tests/EComAPI.Application.Tests.csproj
      publishTestResults: false
      arguments: --configuration $(buildConfiguration) --no-build --collect:"XPlat Code Coverage" --logger "trx" --results-directory $(Agent.TempDirectory)/TestResults
    env:
      ASPNETCORE_ENVIRONMENT: CI
      ConnectionStrings__SQLServerThrifted: $(ConnectionStrings__SQLServerThrifted)
      JwtSettings__Secret: $(JwtSettings__Secret)
      JwtSettings__Issuer: $(JwtSettings__Issuer)
      JwtSettings__Audience: $(JwtSettings__Audience)
      JwtSettings__ExpiryMinutes: $(JwtSettings__ExpiryMinutes)
      Redis__Enabled: $(Redis__Enabled)
      Email__Enabled: $(Email__Enabled)
      AzureBlobStorage__Enabled: $(AzureBlobStorage__Enabled)

  - task: DotNetCoreCLI@2
    displayName: Test API Layer (Optional)
    condition: and(succeeded(), eq(variables['runApiIntegrationTests'], 'true'))
    inputs:
      command: test
      projects: tests/EComAPI.API.Tests/EComAPI.API.Tests.csproj
      publishTestResults: false
      arguments: --configuration $(buildConfiguration) --no-build --collect:"XPlat Code Coverage" --logger "trx" --results-directory $(Agent.TempDirectory)/TestResults
    env:
      ASPNETCORE_ENVIRONMENT: CI
      ConnectionStrings__SQLServerThrifted: $(ConnectionStrings__SQLServerThrifted)
      JwtSettings__Secret: $(JwtSettings__Secret)
      JwtSettings__Issuer: $(JwtSettings__Issuer)
      JwtSettings__Audience: $(JwtSettings__Audience)
      JwtSettings__ExpiryMinutes: $(JwtSettings__ExpiryMinutes)
      Redis__Enabled: $(Redis__Enabled)
      Email__Enabled: $(Email__Enabled)
      AzureBlobStorage__Enabled: $(AzureBlobStorage__Enabled)

  - task: PublishTestResults@2
    displayName: Publish Test Results
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: VSTest
      testResultsFiles: $(Agent.TempDirectory)/TestResults/**/*.trx
      searchFolder: $(Agent.TempDirectory)/TestResults
      mergeTestResults: true
      failTaskOnFailedTests: true
      testRunTitle: EComAPI Test Results

  - task: PublishCodeCoverageResults@1
    displayName: Publish Code Coverage
    condition: succeededOrFailed()
    inputs:
      codeCoverageTool: Cobertura
      summaryFileLocation: $(Agent.TempDirectory)/TestResults/**/coverage.cobertura.xml
      failIfCoverageEmpty: false